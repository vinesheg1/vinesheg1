name: Update Dual Credly Badges

on:
  schedule:
    # Runs at midnight on the 1st and 16th of every month (Every 15 Days)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual override triggers

permissions:
  contents: write

jobs:
  sync-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch and Inject Badges
        env:
          PERSONAL_USER: 'vinesh-eg' # <-- 1. SET YOUR PERSONAL PROFILE HANDLE
          ORG_USER: 'vinesh-eg.09e7ae76'     # <-- 2. SET YOUR CORPORATE PROFILE HANDLE
        run: |
          python - << 'EOF'
          import os
          import re
          import html
          import requests

          def get_badges_html(username):
              if not username:
                  return "<!-- Username empty -->"

              # Pull data straight from Credly public consumer endpoint
              url = f"https://credly.com/users/{username}/badges.json"
              response = requests.get(url, timeout=15)
              if response.status_code != 200:
                  return f"<!-- Failed to fetch data for {username}. HTTP {response.status_code} -->"

              data = response.json().get('data', [])
              if not data:
                  return "<!-- No public badges found on this profile -->"

              html_output = '<div align="left">\n'
              for badge in data:
                  badge_template = badge.get('badge_template') or {}
                  badge_name = badge_template.get('name', 'Badge')
                  image_url = badge_template.get('image_url', '')
                  badge_id = badge.get('id') or badge_template.get('id', '')
                  verification_url = f"https://credly.com{badge_id if badge_id.startswith('/') else '/' + badge_id}" if badge_id else '#'

                  skills = []
                  skill_sources = [
                      badge.get('skills'),
                      badge_template.get('skills'),
                      badge.get('skill_names'),
                      badge_template.get('skill_names'),
                  ]

                  for source in skill_sources:
                      if isinstance(source, list):
                          for skill in source:
                              if isinstance(skill, dict):
                                  name = skill.get('name') or skill.get('display_name') or skill.get('skill_name') or skill.get('title')
                                  if name:
                                      skills.append(name)
                              elif isinstance(skill, str) and skill.strip():
                                  skills.append(skill.strip())
                      elif isinstance(source, dict):
                          name = source.get('name') or source.get('display_name') or source.get('skill_name') or source.get('title')
                          if name:
                              skills.append(name)
                      elif isinstance(source, str) and source.strip():
                          skills.append(source.strip())

                  seen = set()
                  unique_skills = []
                  for skill in skills:
                      if skill and skill not in seen:
                          seen.add(skill)
                          unique_skills.append(skill)

                  html_output += '  <div style="display:inline-block; vertical-align:top; margin:8px 8px 12px 0; text-align:left;">\n'
                  if image_url:
                      html_output += f'    <a href="{html.escape(verification_url)}" target="_blank" rel="noopener noreferrer"><img src="{html.escape(image_url)}" width="70" height="70" alt="{html.escape(badge_name)}" title="{html.escape(badge_name)}" style="margin-bottom:6px;"/></a>\n'
                  else:
                      html_output += '    <div style="width:70px; height:70px; margin-bottom:6px; background:#f5f5f5; border-radius:8px;"></div>\n'

                  if unique_skills:
                      skill_html = ''.join(
                          f'      <span style="display:inline-block; margin:2px 2px 0 0; padding:2px 6px; border-radius:999px; background:#eef2ff; color:#4338ca; font-size:11px; line-height:1.2;">{html.escape(skill)}</span>\n'
                          for skill in unique_skills
                      )
                      html_output += '    <div style="max-width:120px;">\n'
                      html_output += '      <div style="font-size:10px; font-weight:bold; color:#4b5563; margin-bottom:3px;">Skills</div>\n'
                      html_output += skill_html
                      html_output += '    </div>\n'

                  html_output += '  </div>\n'

              html_output += '</div>'
              return html_output

          # Open the file
          with open('README.md', 'r', encoding='utf-8') as file:
              readme = file.read()

          # Process the request string
          personal_html = get_badges_html(os.getenv('PERSONAL_USER'))
          org_html = get_badges_html(os.getenv('ORG_USER'))

          # Inject changes
          readme = re.sub(r"(<!-- START_SECTION:credly-personal -->)(.*?)(<!-- END_SECTION:credly-personal -->)", f"\\1\n{personal_html}\n\\3", readme, flags=re.DOTALL)
          readme = re.sub(r"(<!-- START_SECTION:credly-org -->)(.*?)(<!-- END_SECTION:credly-org -->)", f"\\1\n{org_html}\n\\3", readme, flags=re.DOTALL)

          # Write out content
          with open('README.md', 'w', encoding='utf-8') as file:
              file.write(readme)
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Sync: Updated Personal & Org Credly Badges" && git push)
