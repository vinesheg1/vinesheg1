name: Update Dual Credly Badges

on:
  schedule:
    # Runs at midnight on the 1st and 16th of every month (Every 15 Days)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual override triggers

permissions:
  contents: write

jobs:
  sync-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch and Inject Badges
        env:
          PERSONAL_USER: 'vinesh-eg' # <-- 1. SET YOUR PERSONAL PROFILE HANDLE
          ORG_USER: 'vinesh-eg.09e7ae76'     # <-- 2. SET YOUR CORPORATE PROFILE HANDLE
        run: |
          python - << 'EOF'
          import os
          import re
          import html
          from urllib.parse import quote
          import requests

          def get_badges_data(username):
              if not username:
                  return []

              url = f"https://credly.com/users/{username}/badges.json"
              response = requests.get(url, timeout=15)
              if response.status_code != 200:
                  return []

              data = response.json().get('data', [])
              badges = []
              for badge in data:
                  badge_template = badge.get('badge_template') or {}
                  badge_name = badge_template.get('name', 'Badge')
                  image_url = badge_template.get('image_url', '')
                  badge_id = badge.get('id') or badge_template.get('id', '')
                  verification_url = f"https://credly.com{badge_id if badge_id.startswith('/') else '/' + badge_id}" if badge_id else '#'

                  skills = []
                  skill_sources = [
                      badge.get('skills'),
                      badge_template.get('skills'),
                      badge.get('skill_names'),
                      badge_template.get('skill_names'),
                  ]

                  for source in skill_sources:
                      if isinstance(source, list):
                          for skill in source:
                              if isinstance(skill, dict):
                                  name = skill.get('name') or skill.get('display_name') or skill.get('skill_name') or skill.get('title')
                                  if name:
                                      skills.append(name)
                              elif isinstance(skill, str) and skill.strip():
                                  skills.append(skill.strip())
                      elif isinstance(source, dict):
                          name = source.get('name') or source.get('display_name') or source.get('skill_name') or source.get('title')
                          if name:
                              skills.append(name)
                      elif isinstance(source, str) and source.strip():
                          skills.append(source.strip())

                  seen = set()
                  unique_skills = []
                  for skill in skills:
                      if skill and skill not in seen:
                          seen.add(skill)
                          unique_skills.append(skill)

                  badges.append({
                      'name': badge_name,
                      'image_url': image_url,
                      'verification_url': verification_url,
                      'skills': unique_skills,
                  })

              return badges

          def is_image_available(image_url):
              if not image_url:
                  return False
              try:
                  response = requests.head(image_url, timeout=10, allow_redirects=True)
                  return response.status_code < 400
              except requests.RequestException:
                  return False

          def render_badges_html(badges):
              if not badges:
                  return '<div align="left"><!-- No badges found --></div>'

              colors = ['16a34a', '2563eb', '9333ea', 'dc2626', 'd97706', '0f766e', '7c3aed', '0891b2', 'ea580c', 'be185d']
              html_output = '<div align="left">\n'
              for index, badge in enumerate(badges):
                  badge_name = badge['name']
                  image_url = badge['image_url']
                  verification_url = badge['verification_url']

                  if image_url and is_image_available(image_url):
                      html_output += f'  <a href="{html.escape(verification_url)}" target="_blank" rel="noopener noreferrer" style="display:inline-block; margin:5px;"><img src="{html.escape(image_url)}" width="70" height="70" alt="{html.escape(badge_name)}" title="{html.escape(badge_name)}"/></a>\n'
                  else:
                      safe_name = re.sub(r'[^A-Za-z0-9._-]+', '-', badge_name).strip('-') or 'badge'
                      color = colors[index % len(colors)]
                      badge_url = f"https://img.shields.io/badge/{quote(safe_name, safe='')}-{color}"
                      html_output += f'  <a href="{html.escape(verification_url)}" target="_blank" rel="noopener noreferrer" style="display:inline-block; margin:5px;"><img src="{badge_url}" width="70" height="70" alt="{html.escape(badge_name)}" title="{html.escape(badge_name)}"/></a>\n'

              html_output += '</div>'
              return html_output

          def merge_badge_content(existing_content, generated_content):
              existing_items = (existing_content or '').strip()
              generated_items = (generated_content or '').strip()

              if existing_items.startswith('<div align="left">') and existing_items.endswith('</div>'):
                  existing_items = existing_items[len('<div align="left">'):-len('</div>')].strip()
              if generated_items.startswith('<div align="left">') and generated_items.endswith('</div>'):
                  generated_items = generated_items[len('<div align="left">'):-len('</div>')].strip()

              pieces = [piece for piece in [existing_items, generated_items] if piece]
              if not pieces:
                  return '<div align="left"><!-- No badges found --></div>'

              return '<div align="left">\n' + '\n'.join(pieces) + '\n</div>'

          def replace_section_content(readme_text, start_marker, end_marker, new_content):
              pattern = re.compile(rf"({re.escape(start_marker)})(.*?)(\{re.escape(end_marker)})", re.DOTALL)
              def repl(match):
                  existing_content = match.group(2)
                  combined_content = merge_badge_content(existing_content, new_content)
                  return f"{match.group(1)}\n{combined_content}\n{match.group(3)}"
              return pattern.sub(repl, readme_text, count=1)

          def render_skills_html(badges):
              all_skills = []
              for badge in badges:
                  all_skills.extend(badge['skills'])

              seen = set()
              unique_skills = []
              for skill in all_skills:
                  if skill and skill not in seen:
                      seen.add(skill)
                      unique_skills.append(skill)

              if not unique_skills:
                  return ''

              colors = ['16a34a', '2563eb', '9333ea', 'dc2626', 'd97706', '0f766e', '7c3aed', '0891b2', 'ea580c', 'be185d']
              skill_html = ''
              for index, skill in enumerate(unique_skills):
                  color = colors[index % len(colors)]
                  encoded_skill = quote(skill, safe='')
                  badge_url = f"https://img.shields.io/badge/{encoded_skill}-{color}"
                  skill_html += f'  <img src="{badge_url}" alt="{html.escape(skill)}" title="{html.escape(skill)}" style="margin:5px;"/>\n'
              return '<div align="left">\n' + skill_html + '</div>'

          # Open the file
          with open('README.md', 'r', encoding='utf-8') as file:
              readme = file.read()

          # Process the request string
          personal_badges = get_badges_data(os.getenv('PERSONAL_USER'))
          org_badges = get_badges_data(os.getenv('ORG_USER'))
          all_badges = personal_badges + org_badges

          personal_badges_html = render_badges_html(personal_badges)
          org_badges_html = render_badges_html(org_badges)
          skills_html = render_skills_html(all_badges)

          # Inject changes
          readme = replace_section_content(readme, '<!-- START_SECTION:credly-personal -->', '<!-- END_SECTION:credly-personal -->', personal_badges_html)
          readme = replace_section_content(readme, '<!-- START_SECTION:credly-org -->', '<!-- END_SECTION:credly-org -->', org_badges_html)
          readme = re.sub(r"(<!-- START_SECTION:credly-skills -->)(.*?)(<!-- END_SECTION:credly-skills -->)", f"\\1\n{skills_html}\n\\3", readme, flags=re.DOTALL)

          # Write out content
          with open('README.md', 'w', encoding='utf-8') as file:
              file.write(readme)
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Sync: Updated Personal & Org Credly Badges" && git push)
